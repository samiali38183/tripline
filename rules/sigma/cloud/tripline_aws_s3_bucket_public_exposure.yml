title: AWS S3 Bucket Made Public via ACL or Bucket Policy
id: 8f6a2c41-5d7e-4b0a-a3c9-1e2f3d4c5b6a
status: experimental
description: |
    Detects an S3 bucket ACL that grants access to the AllUsers / AuthenticatedUsers group, or a
    bucket policy whose principal is "*". Both expose bucket contents to anonymous or any-AWS
    readers and precede bulk collection from cloud storage (T1530).
references:
    - https://summitroute.com/blog/2020/10/09/public_dataset_of_cloudtrail_logs_from_flaws_cloud/
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/acl-overview.html#specifying-grantee-predefined-groups
    - https://stratus-red-team.cloud/attack-techniques/AWS/aws.exfiltration.s3-backdoor-bucket-policy/
author: Sami Ali (tripline)
date: 2026-11-04
tags:
    - attack.collection
    - attack.exfiltration
    - attack.t1530
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_acl:
        eventSource: s3.amazonaws.com
        eventName: PutBucketAcl
        requestParameters.AccessControlPolicy.AccessControlList.Grant.Grantee.URI|endswith:
            - '/global/AllUsers'
            - '/global/AuthenticatedUsers'
    selection_policy:
        eventSource: s3.amazonaws.com
        eventName: PutBucketPolicy
    selection_policy_principal:
        - requestParameters.bucketPolicy.Statement.Principal: '*'
        - requestParameters.bucketPolicy.Statement.Principal.AWS: '*'
    filter_failed:
        errorCode|exists: true
    condition: (selection_acl or (selection_policy and selection_policy_principal)) and not filter_failed
falsepositives:
    - Buckets that intentionally host public static websites; allowlist by requestParameters.bucketName.
level: high
