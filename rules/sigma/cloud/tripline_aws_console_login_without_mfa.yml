title: AWS Console Login Without MFA
id: 3b1f0d2e-7c4a-4d5b-9e8f-2a6c1d0b9f41
status: experimental
description: |
    Detects a successful AWS Management Console sign-in by an IAM user or the root user that did
    not use multi-factor authentication. A console session opened with a stolen password and no
    second factor is the most common form of cloud account abuse (T1078.004).
references:
    - https://stratus-red-team.cloud/attack-techniques/AWS/aws.initial-access.console-login-without-mfa/
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
author: Sami Ali (tripline)
date: 2026-11-04
tags:
    - attack.initial-access
    - attack.persistence
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: signin.amazonaws.com
        eventName: ConsoleLogin
        responseElements.ConsoleLogin: Success
        additionalEventData.MFAUsed: 'No'
        userIdentity.type:
            - IAMUser
            - Root
    filter_federated:
        userIdentity.type: AssumedRole
    condition: selection and not filter_federated
falsepositives:
    - Accounts intentionally exempt from MFA (break-glass users); allowlist them by userIdentity.arn.
level: high
