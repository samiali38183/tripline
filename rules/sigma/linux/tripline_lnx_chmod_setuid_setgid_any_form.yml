title: Setuid or Setgid Bit Set via Chmod (Any Mode Form)
id: 7f3c2b1a-6d4e-4a9b-9c8d-1e2f3a4b5c6d
status: experimental
description: |
    Detects chmod setting the setuid or setgid bit in any symbolic form (u+s, g+s, u+xs, ug+s, a+s,
    +s, also in a later clause of a list such as g+w,u+s) or in an octal mode whose special-bits
    digit includes setuid (4) or setgid (2): 2xxx to 7xxx, with or without a leading zero (04755).
    Also matches the busybox multicall form (`busybox chmod u+s f`). Sticky-only modes (1xxx) and
    clearing the bit (u-s) do not match. The only exclusion is a chmod whose every file operand is under /usr/share/doc/ (package documentation directories);
    a doc path appended to another target, or a path containing '..', does not exclude the event.
    Complements the SigmaHQ 'Setuid and Setgid' rule, which only matches ' chmod u+s' / ' chmod g+s'
    and misses Atomic Red Team T1548.001-3/-5 ('chmod u+xs', 'chmod g+xs') as recorded by tripline.
references:
    - https://attack.mitre.org/techniques/T1548/001/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1548.001/T1548.001.md
author: tripline
date: 2026-11-04
modified: 2026-11-11
tags:
    - attack.privilege-escalation
    - attack.t1548.001
logsource:
    product: linux
    category: process_creation
detection:
    selection_image:
        Image|endswith:
            - '/chmod'
            - '/busybox'  # `busybox chmod u+s f`: the CommandLine patterns below still require the chmod token
    selection_symbolic:
        CommandLine|re: '(^|[\s/])chmod\s+(-[A-Za-z-]+\s+)*([ugoa]*[-+=][rwxXst]*,)*[ugoa]*[+=][rwxXt]*s[rwxXt]*(,\S*)?(\s|$)'
    selection_octal:
        CommandLine|re: '(^|[\s/])chmod\s+(-[A-Za-z-]+\s+)*0?[2-7][0-7]{3}(\s|$)'
    filter_tmp_runner:
        CommandLine|re: '^(\S*/)?chmod\s+(-[A-Za-z-]+\s+)*\S+(\s+/usr/share/doc/([\w+~:@%/-]|\.[\w+~:@%/-])*\.?)+\s*$'
    condition: selection_image and (selection_symbolic or selection_octal) and not filter_tmp_runner
falsepositives:
    - Package installation scripts legitimately setting setuid helpers (dpkg, rpm postinst)
    - Administrators hardening binaries
level: medium
