[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "tripline"
version = "0.1.0"
description = "Detection quality gate: replay ATT&CK telemetry through Sigma rules and score weighted coverage in CI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Sami Ali", email = "samiali38183@gmail.com" }]
keywords = ["sigma", "detection-engineering", "mitre-attack", "purple-team", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.14.2",
  "PyYAML>=6.0.3",
  "pySigma>=2.0.1",
  "typer>=0.27.3",
  "Jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.3",
  "mypy>=2.4.1",
  "types-PyYAML",
  "sigma-cli>=4.0.0",
]

[project.scripts]
tripline = "tripline.cli:app"

[project.urls]
Homepage = "https://github.com/samiali38183/tripline"
Issues = "https://github.com/samiali38183/tripline/issues"

[tool.hatch.build.targets.wheel]
packages = ["tripline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sigma.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["tripline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
