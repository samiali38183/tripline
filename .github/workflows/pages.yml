name: pages

# Builds the HTML coverage report from a fresh replay of main and publishes it to GitHub Pages.
# The build job always runs and uploads the report as an artifact. The deploy job only runs when
# the repository variable PAGES_ENABLED is "true" (Settings > Pages > Source: GitHub Actions, then
# Settings > Secrets and variables > Actions > Variables), so this workflow stays green before
# Pages is switched on. ci.yml does not depend on it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      # score exits 1 when the gate fails; the report should still be published so the
      # failure is visible, and ci.yml is what turns the commit red.
      - run: tripline score -o site/scorecard.json || true
      - run: tripline report site/scorecard.json --html site/index.html --badge site/coverage.svg
      - run: tripline heatmap site/scorecard.json -o site/navigator_layer.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.PAGES_ENABLED == 'true'
        with:
          path: site/

  deploy:
    name: deploy to Pages
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the Pages artifact
      id-token: write # OIDC token that deploy-pages verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
