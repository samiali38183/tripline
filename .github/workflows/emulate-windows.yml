name: emulate-windows

# Phase A2: run the Windows Atomic Red Team tests on a disposable windows-latest runner with
# Sysmon (SwiftOnSecurity config), Security process auditing (4688 + command line, 4698 task
# creation) and PowerShell script-block logging, export the three channels as NDJSON, slice by
# tripline markers into fixtures, and assert the expected Sigma rules fire. Fixtures are uploaded
# as an artifact; a maintainer reviews and commits them.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1" # weekly drift check (Monday 06:41 UTC)

permissions:
  contents: read

jobs:
  emulate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .

      - name: Relax Defender for the atomics (disposable runner)
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -DisableIOAVProtection $true -DisableBehaviorMonitoring $true -ErrorAction Stop
            Add-MpPreference -ExclusionPath 'C:\AtomicRedTeam', "$env:TEMP", 'C:\Windows\Temp' -ErrorAction SilentlyContinue
            Write-Host "Defender real-time monitoring disabled"
          } catch { Write-Warning "Defender settings not changed: $_" }

      - name: Install Sysmon with the SwiftOnSecurity configuration
        run: |
          $zip = "$env:TEMP\Sysmon.zip"
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Sysmon.zip' -OutFile $zip -UseBasicParsing
          Expand-Archive $zip -DestinationPath "$env:TEMP\Sysmon" -Force
          $cfg = "$env:TEMP\sysmonconfig.xml"
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml' -OutFile $cfg -UseBasicParsing
          # The SwiftOnSecurity config ships ProcessAccess (EID 10) as an empty include, so nothing
          # is logged and process_access rules (T1003.001) see 0 applicable events. Log access to
          # lsass.exe only.
          [xml]$x = Get-Content $cfg -Raw
          $pa = $x.SelectSingleNode("//EventFiltering/RuleGroup/ProcessAccess[@onmatch='include']")
          if (-not $pa) { throw "ProcessAccess include block not found in sysmon config" }
          $t = $x.CreateElement('TargetImage')
          $t.SetAttribute('condition', 'end with')
          $t.InnerText = '\lsass.exe'
          [void]$pa.AppendChild($t)
          $x.Save($cfg)
          Write-Host "ProcessAccess include: $($pa.OuterXml)"
          & "$env:TEMP\Sysmon\Sysmon64.exe" -accepteula -i $cfg | Out-Null
          Start-Sleep 3
          Get-Service Sysmon64 | Format-Table Status, Name
          (Get-WinEvent -LogName 'Microsoft-Windows-Sysmon/Operational' -MaxEvents 1).TimeCreated

      - name: Enable Security auditing and PowerShell script-block logging
        run: |
          auditpol /set /subcategory:"Process Creation" /success:enable /failure:enable
          auditpol /set /subcategory:"Other Object Access Events" /success:enable /failure:enable
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit' -Name ProcessCreationIncludeCmdLine_Enabled -Value 1 -Type DWord
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -Name EnableScriptBlockLogging -Value 1 -Type DWord
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging' -Name EnableModuleLogging -Value 1 -Type DWord
          auditpol /get /subcategory:"Process Creation"

      - name: Install Invoke-AtomicRedTeam + atomics
        run: |
          IEX (IWR 'https://raw.githubusercontent.com/redcanaryco/invoke-atomicredteam/master/install-atomicredteam.ps1' -UseBasicParsing)
          Install-AtomicRedTeam -getAtomics -Force
          Import-Module 'C:\AtomicRedTeam\invoke-atomicredteam\Invoke-AtomicRedTeam.psd1' -Force
          (Get-ChildItem C:\AtomicRedTeam\atomics -Directory).Count

      # windows-latest is Windows Server 2025 (build 26100), where WMIC is an optional feature
      # that is not installed. Without it T1047-5 fails with "'wmic' is not recognized".
      - name: Install WMIC optional feature
        shell: powershell
        run: |
          if (-not (Get-Command wmic.exe -ErrorAction SilentlyContinue)) {
            $cap = Get-WindowsCapability -Online -Name 'WMIC*' | Select-Object -First 1
            if ($cap) {
              Write-Host "adding $($cap.Name) (state $($cap.State))"
              try { Add-WindowsCapability -Online -Name $cap.Name -ErrorAction Stop | Out-Null }
              catch { Write-Warning "WMIC not installed: $_" }
            } else { Write-Warning "no WMIC capability offered by this image" }
          }
          Get-Command wmic.exe -ErrorAction SilentlyContinue | Format-Table Name, Source

      # Invoke-AtomicTest runs prereqs and powershell executors in a child powershell.exe
      # (Windows PowerShell 5.1). Started from pwsh 7 that child could not load PowerShellGet
      # (it inherits pwsh's PSModulePath), so the prereq of T1059.001-16 (Install-Module
      # AtomicTestHarnesses) failed. Install the module from Windows PowerShell up front.
      - name: Install AtomicTestHarnesses for Windows PowerShell
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope AllUsers | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # Invoke-AtomicRedTeam requires powershell-yaml, and the atomics now run under this
          # shell (Windows PowerShell 5.1), so the module has to be installed for it too.
          Install-Module -Name powershell-yaml -Scope AllUsers -Force -AllowClobber
          Install-Module -Name AtomicTestHarnesses -Scope AllUsers -Force -AllowClobber
          Get-Module powershell-yaml, AtomicTestHarnesses -ListAvailable | Format-Table Name, Version, ModuleBase

      - name: List Windows atomic tests from scenarios
        run: |
          tripline atomics windows | Out-File tests.txt -Encoding ascii
          Get-Content tests.txt

      # Run from Windows PowerShell 5.1 so the child powershell.exe processes the atomics spawn
      # get a native 5.1 module path (see the AtomicTestHarnesses step above). Add-Content with
      # ASCII avoids the BOM that 5.1's Out-File -Encoding utf8 writes into GITHUB_ENV.
      - name: Run atomics between tripline markers
        shell: powershell
        run: |
          $runGuid = [guid]::NewGuid().ToString()
          Add-Content -Path $env:GITHUB_ENV -Value "RUN_GUID=$runGuid" -Encoding ascii
          $start = (Get-Date).AddSeconds(-5)
          Add-Content -Path $env:GITHUB_ENV -Value "EXPORT_SINCE=$($start.ToString('o'))" -Encoding ascii
          Write-Host "run guid $runGuid, export since $start"
          Import-Module 'C:\AtomicRedTeam\invoke-atomicredteam\Invoke-AtomicRedTeam.psd1' -Force
          foreach ($line in Get-Content tests.txt) {
            $sid, $guid, $tech = $line -split ' '
            Write-Host "::group::$sid $tech $guid"
            try { Invoke-AtomicTest $tech -TestGuids $guid -GetPrereqs -ErrorAction Continue } catch { Write-Warning "prereqs: $_" }
            cmd.exe /c "echo tripline-marker $runGuid $guid start"
            try { Invoke-AtomicTest $tech -TestGuids $guid -TimeoutSeconds 90 -ErrorAction Continue } catch { Write-Warning "atomic: $_" }
            Start-Sleep 3
            cmd.exe /c "echo tripline-marker $runGuid $guid end"
            try { Invoke-AtomicTest $tech -TestGuids $guid -Cleanup -ErrorAction Continue } catch { Write-Warning "cleanup: $_" }
            Write-Host "::endgroup::"
          }

      - name: Export Sysmon, Security and PowerShell events
        run: |
          Start-Sleep 5
          ./scripts/windows/Export-TriplineEvents.ps1 -Since ([datetime]$env:EXPORT_SINCE) -Out events.ndjson
          (Get-Content events.ndjson | Measure-Object -Line).Lines
          (Select-String -Path events.ndjson -Pattern 'tripline-marker' | Measure-Object).Count

      - name: Collect fixtures and assert expected rules fire
        run: |
          tripline windows collect events.ndjson `
            --run-guid "$env:RUN_GUID" `
            --source "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            --require-all --replay

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-fixtures-${{ github.run_id }}
          path: |
            fixtures/windows/
            events.ndjson
          retention-days: 30
