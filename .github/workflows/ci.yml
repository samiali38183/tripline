name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check tripline tests
      - run: ruff check tripline tests
      - run: mypy tripline
      - run: pytest --cov=tripline --cov-report=term --cov-report=xml --junitxml=pytest-junit.xml
      - run: sigma check rules/
      - name: Lint workflows (zizmor, offline, auditor persona)
        run: |
          python -m pip install zizmor==1.32.0
          zizmor --offline --persona auditor .github
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-results
          path: |
            pytest-junit.xml
            coverage.xml

  gate:
    name: detection gate (tripline replay --all)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the scorecard PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: tripline validate
      - name: Replay fixtures through expected rules
        id: replay
        run: tripline replay --all --junit replay-junit.xml --scorecard scorecard.json
      - name: Score (always, so the PR comment shows the failing table)
        if: always()
        run: tripline score -o scorecard.json --markdown scorecard.md || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: detection-gate
          path: |
            replay-junit.xml
            scorecard.json
            scorecard.md
      - name: Comment scorecard on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GATE_OUTCOME: ${{ steps.replay.outcome }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tripline-scorecard -->';
            const outcome = process.env.GATE_OUTCOME;
            const body = fs.existsSync('scorecard.md') ? fs.readFileSync('scorecard.md', 'utf8') : '_scorecard.md was not produced_';
            const header = outcome === 'success' ? '### tripline detection gate: passed' : '### tripline detection gate: FAILED';
            const text = `${marker}\n${header}\n\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const mine = comments.data.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
            }
